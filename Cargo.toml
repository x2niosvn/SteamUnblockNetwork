[package]
name = "steam-unblock-network"
version = "1.0.0"
edition = "2021"
authors = ["x2niosvn <x2niosvn@gmail.com>"]
description = "Steam Unblock Network - DoH Resolver, SNI Proxy & TLS Fragmenter on Windows"
repository = "https://github.com/x2niosvn/SteamUnblockNetwork"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }
once_cell = "1.19"
parking_lot = "0.12"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
