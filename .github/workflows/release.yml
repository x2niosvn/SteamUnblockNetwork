name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Artifacts & Checksums
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v') { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $ver) { $ver = "v1.0.0" }

          $exe = "target/release/steam-unblock-network.exe"
          $zipName = "SteamUnblockNetwork-$ver-windows-x64.zip"

          # Create standalone zip package
          Compress-Archive -Path $exe, "steam-domains.txt", "README.md" -DestinationPath $zipName -Force

          # Calculate SHA256
          $hashExe = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $hashZip = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          
          "$hashExe  steam-unblock-network.exe" | Out-File -Encoding utf8 SHA256SUMS.txt
          "$hashZip  $zipName" | Out-File -Encoding utf8 -Append SHA256SUMS.txt

          echo "RELEASE_TAG=$ver" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Steam Unblock Network ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/steam-unblock-network.exe
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

